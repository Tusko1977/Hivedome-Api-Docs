<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hivedome API Docs</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
    li { margin: .5rem 0; }
  </style>
</head>
<body>
  <h1>Hivedome API Docs</h1>
  <ul id="list"></ul>
  <script src="/specs.js"></script>
  <script>
    document.getElementById("list").innerHTML = Object.entries(SPECS)
      .filter(([path, s]) => s.listed)
      .map(([path, s]) => `<li><a href="/${path}">${s.title}</a> <small>/${path}</small></li>`)
      .join("");
  </script>
</body>
</html>
