<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>API Docs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    /* Tighten Swagger UI's default spacing around the title and servers */
    .swagger-ui .info { margin: 24px 0 16px; }
    .swagger-ui .info hgroup.main { margin: 0 0 10px; }
    .swagger-ui .info .description p { margin: 4px 0; }
    .swagger-ui .scheme-container { padding: 16px 0; margin: 0 0 12px; }
    .swagger-ui .servers > label { margin-top: 0; }
    .swagger-ui .servers .computed-url { margin: 10px 0; }
    .swagger-ui .servers h4.message { padding-bottom: 4px; margin: 10px 0 0; }
    .swagger-ui .servers table td { padding-top: 4px; padding-bottom: 4px; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="/specs.js"></script>
  <script>
    window.onload = async () => {
	  // e.g. "/invoicing/" -> "invoicing"
	  const key = location.pathname.replace(/^\/+|\/+$/g, "");
	  // Listed docs come from specs.js; hidden docs load by folder name
	  const url = SPECS[key] ? SPECS[key].url : `/openapi/${key}/openapi.yaml`;

	  const found = key && (await fetch(url, { method: "HEAD" }).then(r => r.ok, () => false));
	  if (!found) {
		document.getElementById("swagger-ui").innerHTML =
		  "<p style='font-family:sans-serif;padding:2rem'>No API docs found at this URL. <a href='/'>See all docs</a></p>";
		return;
	  }

	  const ui = SwaggerUIBundle({
		url: url,
		dom_id: "#swagger-ui",
		defaultModelsExpandDepth: -1,
		deepLinking: true,
		onComplete: () => {
		  document.title = ui.specSelectors.info().get("title") || "API Docs";
		},
	  });

	  // Scroll expanded operation to top of viewport
	  document.addEventListener("click", (e) => {
		const summary = e.target.closest(".opblock-summary");
		if (summary) {
		  const opblock = summary.closest(".opblock");
		  setTimeout(() => {
			opblock.scrollIntoView({ behavior: "smooth", block: "start" });
		  }, 100); // wait for expand animation/render
		}
	  });
	};
  </script>
</body>
</html>
