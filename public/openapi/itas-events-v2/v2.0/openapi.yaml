openapi: 3.0.3
info:
  title: ITAS Events API
  version: '2.0'
servers:
  - url: http://{yourServer}:4710
    variables:
      yourServer:
        default: localhost
        description: Hostname or IP address of the ITAS server
  - url: https://{yourServer}:5710
    variables:
      yourServer:
        default: localhost
        description: Hostname or IP address of the ITAS server
security:
  - bearerAuth: []
tags:
- name: Subscribers
- name: Topics
- name: Subscriptions
- name: Messages
- name: Migrated Events v1 Endpoints
paths:
  /Subscribers:
    get:
      tags:
      - Subscribers
      summary: List Subscribers
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/array [Subscriber Detail]'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
  /Subscribers/{SubscriberId}:
    get:
      tags:
      - Subscribers
      summary: Read Subscriber
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber Detail'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
      - Subscribers
      summary: Delete Subscriber
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber Detail'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: path
        required: true
        schema:
          type: string
  /Subscribers/{SubscriberName}:
    post:
      tags:
      - Subscribers
      summary: Create Subscriber
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber Detail'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberName
        in: path
        required: true
        schema:
          type: string
  /Topics:
    get:
      tags:
      - Topics
      summary: List Topics
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/array [Topic Detail]'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
  /Topics/{TopicName}:
    get:
      tags:
      - Topics
      summary: Read Topic
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic Detail'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: TopicName
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
      - Topics
      summary: Create Topic
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic Detail'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: TopicName
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
      - Topics
      summary: Delete Topic
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic Detail'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: TopicName
        in: path
        required: true
        schema:
          type: string
  /Subscriptions:
    get:
      tags:
      - Subscriptions
      summary: List Subscriptions
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/array [Subscription Detail]'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
  /Subscriptions/{SubscriberId}:
    get:
      tags:
      - Subscriptions
      summary: List Subscriptions for Subscriber
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/array [Subscription Detail]'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
      - Subscriptions
      summary: Delete all Subscriptions for Subscriber
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/array [Subscription Detail]'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: path
        required: true
        schema:
          type: string
  /Subscriptions/{SubscriberId}/{Topic}:
    get:
      tags:
      - Subscriptions
      summary: Read Subscription for Subscriber
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription Detail'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Topic
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
      - Subscriptions
      summary: Create Subscription for Subscriber
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription Detail'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Topic
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
      - Subscriptions
      summary: Delete Subscription for Subscriber
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription Detail'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Topic
        in: path
        required: true
        schema:
          type: string
  /Messages/{SubscriberId}/{Timeout}:
    get:
      tags:
      - Messages
      summary: Read Message
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message Detail'
        '204':
          description: '204 - No Content'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Timeout
        in: path
        required: true
        schema:
          type: string
  /Messages/{Topic}:
    post:
      tags:
      - Messages
      summary: Create Message
      responses:
        '201':
          description: '201'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: Topic
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageBody Create'
  /Messages/{SubscriberId}/{MessageId}:
    delete:
      tags:
      - Messages
      summary: Delete Message
      responses:
        '200':
          description: '200'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: MessageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /Messages/{SubscriberId}/{MessageId}/Reject:
    delete:
      tags:
      - Messages
      summary: Reject Message
      responses:
        '200':
          description: '200'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: MessageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectMessage Body'
  /Events/Register:
    post:
      tags:
      - Migrated Events v1 Endpoints
      summary: Create Mailbox
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Subscribe Detail'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberName
        in: query
        required: true
        schema:
          type: string
  /Events/GetTopic:
    get:
      tags:
      - Migrated Events v1 Endpoints
      summary: Read Topic
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Topic Detail'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: Topic
        in: query
        required: true
        schema:
          type: string
      - name: CompanyCode
        in: query
        required: true
        schema:
          type: string
  /Events/AddTopic:
    put:
      tags:
      - Migrated Events v1 Endpoints
      summary: Create Topic
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Topic Detail'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: Topic
        in: query
        required: true
        schema:
          type: string
      - name: CompanyCode
        in: query
        required: true
        schema:
          type: string
  /Events/Subscribe:
    post:
      tags:
      - Migrated Events v1 Endpoints
      summary: Create Subscription
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Subscription Detail'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: topic
        in: query
        required: true
        schema:
          type: string
      - name: CompanyCode
        in: query
        required: true
        schema:
          type: string
  /Events/ViewSubscriptions:
    get:
      tags:
      - Migrated Events v1 Endpoints
      summary: List Subscriptions
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/array [V1Subscription Detail]'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: query
        required: true
        schema:
          type: string
          format: uuid
  /Events/Publish:
    put:
      tags:
      - Migrated Events v1 Endpoints
      summary: Publish Message
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Publish Message Detail'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: CompanyCode
        in: query
        required: true
        schema:
          type: string
      - name: Topic
        in: query
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageBody Create'
  /Events/Peek:
    get:
      tags:
      - Migrated Events v1 Endpoints
      summary: Peek Message
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Peek Detail'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: Timeout
        in: query
        required: false
        schema:
          type: string
  /Events/Receive:
    post:
      tags:
      - Migrated Events v1 Endpoints
      summary: Receive Message
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ReceiveMessage Detail'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: MessageId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: LockTimeout
        in: query
        required: false
        schema:
          type: number
  /Events/Confirm:
    delete:
      tags:
      - Migrated Events v1 Endpoints
      summary: Confirm Message
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmMessage Detail'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: MessageId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: LockId
        in: query
        required: true
        schema:
          type: string
          format: uuid
  /Events/Unsubscribe:
    post:
      tags:
      - Migrated Events v1 Endpoints
      summary: Unsubscribe Alert Topic
      responses:
        '200':
          description: '200'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: Topic
        in: query
        required: true
        schema:
          type: string
      - name: CompanyCode
        in: query
        required: true
        schema:
          type: string
  /Events/Unregister:
    delete:
      tags:
      - Migrated Events v1 Endpoints
      summary: Unregister Subscriber
      responses:
        '200':
          description: '200'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: SubscriberId
        in: query
        required: true
        schema:
          type: string
          format: uuid
  /Events/UnsubscribeAll:
    post:
      tags:
      - Migrated Events v1 Endpoints
      summary: Unsubscribe All
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1UnsubscribeAll Detail'
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadRequestResponse'
        '405':
          description: '405'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 MethodNotAllowed'
      parameters:
      - name: CompanyCode
        in: query
        required: true
        schema:
          type: string
      - name: Topic
        in: query
        required: true
        schema:
          type: string
      - name: UpdateUser
        in: query
        required: true
        schema:
          type: string
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    200 SuccessResponse:
      type: object
      properties:
        Value:
          type: string
          example: Success
    200 CreateResponse:
      type: object
      properties:
        Value:
          type: string
          example: Created
    200 AuthoriseResponse:
      type: object
      properties:
        Value:
          type: string
          example: Authorised
    200 UpdateResponse:
      type: object
      properties:
        Value:
          type: string
          example: Updated
    201 AuthoriseResponse:
      type: object
      properties:
        Value:
          type: string
          example: Authorised
    201 CreateResponse:
      type: object
      properties:
        Value:
          type: string
          example: Created
    201 UpdateResponse:
      type: object
      properties:
        Value:
          type: string
          example: Updated
    400 BadRequestResponse:
      type: object
      properties:
        Value:
          type: string
          example: Bad Request
    400 Response:
      type: object
      properties:
        Response:
          type: object
          properties:
            Value:
              type: string
              example: 400 Bad Request
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/400 ErrorMessageDetail'
    400 ErrorMessageDetail:
      type: object
      properties:
        Severity:
          type: string
          example: Error
        Message:
          type: string
          example: 'API5058 - Data : The mandatory field {fieldName} was missing in the request body.'
    400 BadPropertyResponse:
      type: object
      properties:
        Response:
          type: object
          properties:
            Value:
              type: string
              example: 400 Bad Request
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/400 BadPropertyErrorMessageDetail'
    400 BadPropertyErrorMessageDetail:
      type: object
      properties:
        Severity:
          type: string
          example: Error
        Message:
          type: string
          example: 'API5068 - API : The value sent in the querystring variable {Property} is not allowed.'
    400 BadReadResponse:
      type: object
      properties:
        Response:
          type: object
          properties:
            Value:
              type: string
              example: 400 Bad Request
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/400 BadReadErrorMessageDetail'
    400 BadReadErrorMessageDetail:
      type: object
      properties:
        Severity:
          type: string
          example: Error
        Message:
          type: string
          example: 'API5075 - API : The value sent in the querystring is not allowed.'
    400 ServiceResponse:
      type: object
      properties:
        Response:
          type: object
          properties:
            Value:
              type: string
              example: 400 Bad Request
        Messages:
          $ref: '#/components/schemas/400 ServiceResponseDetail'
    400 ServiceResponseDetail:
      type: object
      properties:
        Severity:
          type: string
          example: Error
        Messages:
          type: string
          example: 'API5058 - Data : The mandatory field {fieldName} was missing.'
    400 StatusResponse:
      type: object
      properties:
        Response:
          type: object
          properties:
