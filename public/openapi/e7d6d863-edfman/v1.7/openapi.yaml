components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    200 SuccessResponse:
      type: object
      properties:
        Value:
          type: string
          example: Success
    200 UpdateResponse:
      type: object
      properties:
        Value:
          type: string
          example: Updated
    200 DeletedResponse:
      type: object
      properties:
        Value:
          type: string
          example: Deleted
    200 AuthoriseResponse:
      type: object
      properties:
        Value:
          type: string
          example: Authorised
    201 CreateResponse:
      type: object
      properties:
        Value:
          type: string
          example: Created
    201 CreateMessages:
      type: object
      properties:
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/201 ErrorMessageDetail'
    201 ErrorMessageDetail:
      type: object
      properties:
        Severity:
          type: string
          example: Warning
        Message:
          type: string
          example: 'API5084 - API : {fieldName} has a {fieldName} of {value}.'
    201 CreateBllMessages:
      type: object
      properties:
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/201 ErrorBllMessageDetail'
    201 ErrorBllMessageDetail:
      type: object
      properties:
        Severity:
          type: string
          example: Warning
        Message:
          type: string
          example: 'API5084 - API : {fieldName} has a {fieldName} of {value}.'
    400 Response:
      type: object
      properties:
        Response:
          type: object
          properties:
            Value:
              type: string
              example: 400 Bad Request
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/400 ErrorMessageDetail'
    400 ErrorMessageDetail:
      type: object
      properties:
        Severity:
          type: string
          example: Error
        Message:
          type: string
          example: 'API5058 - Data : The mandatory field {fieldName} was missing in the request body.'
    400 BadPropertyResponse:
      type: object
      properties:
        Response:
          type: object
          properties:
            Value:
              type: string
              example: 400 Bad Request
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/400 BadPropertyErrorMessageDetail'
    400 BadPropertyErrorMessageDetail:
      type: object
      properties:
        Severity:
          type: string
          example: Error
        Message:
          type: string
          example: 'API5074 - API : The value sent in the querystring variable {Property} is not allowed.'
    400 BadReadResponse:
      type: object
      properties:
        Response:
          type: object
          properties:
            Value:
              type: string
              example: 400 Bad Request
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/400 BadReadErrorMessageDetail'
    400 BadReadErrorMessageDetail:
      type: object
      properties:
        Severity:
          type: string
          example: Error
        Message:
          type: string
          example: 'API5075 - API : The value sent in the querystring is not allowed.'
    400 WarningMessageDetail:
      type: object
      properties:
        Severity:
          type: string
          example: Warning
        Message:
          type: string
          example: 'API50xx - Data : The field {fieldName} was not found.'
    400 InfoMessageDetail:
      type: object
      properties:
        Severity:
          type: string
          example: Information
        Message:
          type: string
          example: 'API50xx - Data : Now create xyz.'
    404 Response:
      type: object
      properties:
        Response:
          type: object
          properties:
            Value:
              type: string
              example: 404 Not Found
        Messages:
          type: array
          items:
            $ref: '#/components/schemas/404 ErrorMessageDetailMessage'
    404 ErrorMessageDetailMessage:
      type: object
      properties:
        Severity:
          type: string
          example: Warning
        Message:
          type: string
          example: 'API5068 - Data : No records found.'
    405 Response:
      type: object
      properties:
        Response:
          type: object
          properties:
            Value:
              type: string
              example: 405 Method Not Allowed
        Messages:
