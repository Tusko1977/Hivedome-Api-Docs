openapi: 3.0.3
info:
  title: ED&FMan Custom API
  version: '1.7'
  description: |
    **Release notes (5th October 2026.)**

    ## New Endpoints

    - Inventory **Lots Create**: Create Lots, [Link](#/Inventory/CreateLots)
    - Inventory **Lots Update**: Update Lots, [Link](#/Inventory/UpdateLots)
    - Inventory **Lots Delete**: Delete Lots, [Link](#/Inventory/DeleteLots)
    - Inventory **Logistics Plan Create**: Create Logistics Plan, [Link](#/Inventory/CreateLogisticsPlan)
servers:
  - url: https://{yourServer}:5720
    variables:
      yourServer:
        default: localhost
        description: Hostname or IP address of the ITAS server
  - url: http://{yourServer}:4720
    variables:
      yourServer:
        default: localhost
        description: Hostname or IP address of the ITAS server
