openapi: 3.0.3
info:
  title: ITAS Stock Management
  version: '1.1'
  description: 'Release notes: 31 October 2022.'
servers:
  - url: http://{yourServer}:4720
    variables:
      yourServer:
        default: localhost
        description: Hostname or IP address of the ITAS server
  - url: https://{yourServer}:5720
    variables:
      yourServer:
        default: localhost
        description: Hostname or IP address of the ITAS server
security:
