      - ContractId
      - Quantity
    MOCompleteResponse:
      type: object
      properties:
        WarehouseRecords:
          type: array
          items:
            $ref: '#/components/schemas/WarehouseRecordMContract'
    MOCreate:
      type: object
      properties:
        TerminalCode:
          type: string
          example: SIS
        CommodityCodePart1:
          type: string
          example: LGI
        CommodityCodePart2:
          type: string
          example: LGIWHT
        CommodityCodePart3:
          type: string
          example: B25
        PackingTypeCode:
          type: string
          example: B25
        Units:
          type: number
          example: 100
        Quantity:
          type: number
          example: 50
        WarehouseCode:
          type: string
          example: SISWHRS.P
        PreAllocationCode:
          type: string
          example: AS003.S
        TargetDate:
          type: string
          example: '2022-06-22T00:00:00Z'
        OrderDate:
          type: string
          example: '2022-06-20T00:00:00Z'
        Memorandum:
          type: string
          example: Memo
        StatusCode:
          type: string
          example: CUBE
      required:
      - TerminalCode
      - CommodityCodePart1
      - PackingTypeCode
      - Units
    MoveToMO:
      type: object
      properties:
        ManufacturingOrderNo:
          type: number
          example: 500
        ContractId:
          type: string
          example: '800001.000'
        Quantity:
          type: number
          example: 5
        ShedCode:
          type: string
          example: W1
        Units:
          type: number
          example: 50
      required:
      - ManufacturingOrderNo
