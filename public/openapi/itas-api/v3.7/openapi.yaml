openapi: 3.0.3
info:
  title: ITAS API
  version: '3.7'
  description: 'Release notes: 17 August 2026.'
servers:
  - url: http://{yourServer}:4720
    variables:
      yourServer:
        default: localhost
        description: Hostname or IP address of the ITAS server
  - url: https://{yourServer}:5720
    variables:
      yourServer:
        default: localhost
        description: Hostname or IP address of the ITAS server
security:
  - bearerAuth: []
tags:
- name: Client Reference Data
- name: Global Reference Data
- name: Master Reference Data
- name: Nominal Reference Data
- name: Physicals Reference Data
- name: Sequence Reference Data
- name: WIP Reference Data
- name: Accounting-Matching
- name: Accounting-Transactions
- name: Contract-F&O
- name: Contract-Physical
- name: Finance-Banking
- name: Finance-Cash
- name: Global Market Data
- name: Inventory-Deliveries
- name: Inventory-Physicals-Order Scheduling
- name: Inventory-Physicals-Stock Management
- name: Inventory-Physicals-Stock Processing
- name: Valuation-Physical
- name: Data Object Definitions
- name: Composite Key Examples
paths:
  /ReferenceData/{TradingEntityId}/ClientLedger/ClientAccount/{Property}/{PropertyValue}:
    get:
      tags:
      - Client Reference Data
      summary: List ClientAccounts
      operationId: listClientAccounts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  Data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClientAccount List'
                  Pagination:
                    $ref: '#/components/schemas/Pagination'
                  Response:
                    $ref: '#/components/schemas/200 SuccessResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400 BadPropertyResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404 Response'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/405 Response'
      parameters:
      - name: TradingEntityId
        in: path
        required: true
        schema:
          type: string
        example: JT
      - name: Property
        in: path
        required: true
        schema:
          type: string
          enum:
          - Members
          - Status
          - CanBeBuyer
          - CanBeSeller
          - CanBeAgent
          - CanBeShipper
          - CanBeDerivativeClient
          - CanBeDerivativeBroker
          - CanBeForwarder
          - CanBeServiceProvider
          - EDICode
          - AcceptsNettingInstruction
      - name: PropertyValue
        in: path
        required: true
        schema:
          type: string
        example: O
