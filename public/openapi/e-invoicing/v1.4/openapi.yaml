        VatPercentage: &id030
          type: number
        VatableAmount: &id031
          type: number
        VatAmount: &id032
          type: number
        ItasVatCode: &id033
          type: string
          maxLength: 2
        ExemptionReasonCode: &id034
          type: string
          maxLength: 50
        ExemptionReasonDescription: &id035
          type: string
          maxLength: 500
        InvoiceAmount: &id036
          type: number
        VatCurrencyCode: &id037
