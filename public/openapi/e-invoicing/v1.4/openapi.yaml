openapi: 3.0.3
info:
  title: e-Invoicing Custom API
  version: '1.4'
  description: 'Release notes: 5 August 2026.'
servers:
  - url: https://{yourServer}:5720
    variables:
      yourServer:
        default: localhost
        description: Hostname or IP address of the ITAS server
  - url: http://{yourServer}:4720
    variables:
      yourServer:
        default: localhost
        description: Hostname or IP address of the ITAS server
security:
- bearerAuth: []
tags:
- name: Invoices
- name: Data Object Definitions
paths:
  /Invoices/{TradingEntityId}/IncomingInvoice/{Property}/{PropertyValue}:
    get:
      tags:
      - Invoices
      summary: List Incoming Invoice Records
      operationId: listIncomingInvoiceRecords
      parameters:
      - &id001
        name: TradingEntityId
        in: path
        required: true
        schema:
          type: string
        example: JT
        description: Identify specific trading entity.
      - name: Property
        in: path
        required: true
        schema:
          type: string
          enum:
          - AccountCode
          - ClientReference
          - DocumentDate
          - InvoiceRecordId
          - IsProcessed
      - name: PropertyValue
        in: path
        required: true
        schema:
          type: string
        example: ABCDEF.P
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  Data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InvoiceReadBody'
                  Pagination:
                    $ref: '#/components/schemas/Pagination'
                  Response:
