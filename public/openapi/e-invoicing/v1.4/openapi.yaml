  /InvoiceLeg:
    get:
      operationId: InvoiceLeg
      tags:
      - Data Object Definitions
      summary: Invoice Record Leg reference
      description: Reference-only object endpoint; source states these endpoints are not accessible.
      responses:
        '200':
          description: Reference object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLegReadUpdate'
  /InvoiceVatRecord:
    get:
      operationId: InvoiceVatRecord
      tags:
      - Data Object Definitions
      summary: Invoice VAT Record reference
      description: Reference-only object endpoint; source states these endpoints are not accessible.
      responses:
        '200':
          description: Reference object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceVatReadUpdate'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    InvoiceLegCreate:
      type: object
      properties:
        Quantity: &id006
          type: number
        WeightCode: &id007
