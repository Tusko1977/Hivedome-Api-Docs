          maxLength: 4
        Value: &id008
          type: number
        Price: &id009
          type: number
        VatRatePercentage: &id010
          type: number
        InvoiceRecordLegDescription: &id011
          type: string
          maxLength: 255
        VatRateCode: &id012
          type: string
          maxLength: 2
        RateTypeCode: &id013
          type: string
          maxLength: 1
          enum:
          - A
          - R
          - S
          - W
          - '%'
          - Q
          - C
          - L
          - ' '
        PriceTypeCode: &id014
          type: string
          maxLength: 4
        PaymentModeCode: &id015
          type: string
          maxLength: 1
        PaymentId: &id016
          type: string
          maxLength: 255
        BuyerOrderIdentifier: &id017
          type: string
          maxLength: 50
        StartPeriod: &id018
          type: string
          format: date-time
        EndPeriod: &id019
          type: string
          format: date-time
        FreeFormatNote: &id020
          type: string
          maxLength: 255
        BaseQuantity: &id021
          type: number
        ValueType: &id022
          type: string
          enum:
          - Contract
          - Cost
          - Commission
        CostHeadingCode: &id023
          type: string
          maxLength: 8
        DocumentReference: &id024
          type: string
          maxLength: 9
        InvoiceCurrencyCode: &id025
          type: string
          maxLength: 3
        PhysicalTradeId: &id026
          type: string
          maxLength: 10
        CostUniqueId: &id027
          type: number
        VatAmount: &id028
          type: number
      required:
      - Quantity
      - WeightCode
      - Value
      - Price
      - VatRatePercentage
    InvoiceLegReadUpdate:
      type: object
      properties:
        InvoiceRecordId:
          type: number
        InvoiceRecordLegId:
          type: number
        Quantity: *id006
        WeightCode: *id007
        Value: *id008
        Price: *id009
        VatRatePercentage: *id010
        InvoiceRecordLegDescription: *id011
        VatRateCode: *id012
        RateTypeCode: *id013
        PriceTypeCode: *id014
        PaymentModeCode: *id015
        PaymentId: *id016
        BuyerOrderIdentifier: *id017
        StartPeriod: *id018
        EndPeriod: *id019
        FreeFormatNote: *id020
        BaseQuantity: *id021
        ValueType: *id022
        CostHeadingCode: *id023
        DocumentReference: *id024
        InvoiceCurrencyCode: *id025
        PhysicalTradeId: *id026
        CostUniqueId: *id027
        VatAmount: *id028
