        IncomingOrOutgoing:
          type: string
          description: Incoming or Outgoing
          maxLength: 8
          enum:
          - Incoming
          - Outgoing
          default: Incoming
        InvoiceRecordLegs:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLegCreate'
          description: see Invoice Leg object
        InvoiceVatRecords:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceVatCreate'
