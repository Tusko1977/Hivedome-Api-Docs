      - ClientReference
      - CurrencyCode
      - DocumentDate
      - ValueDate
      - Name
      - VatRegistrationNo
      - EInvoiceId
      - TotalInvoiceAmount
      - TotalInvoiceLinesExVatAmount
      - TotalVatAmount
      - InvoicePayableAmount
      - IBAN
      - BIC
      - InvoiceRecordLegs
      - InvoiceVatRecords
    InvoiceReadBody:
      type: object
      properties:
        Source:
          type: string
          maxLength: 8
          enum:
          - eInvoice
          - Email
          default: eInvoice
        IncomingOrOutgoing:
          type: string
          maxLength: 8
          enum:
          - Incoming
