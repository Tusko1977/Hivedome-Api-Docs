openapi: 3.0.3
info:
  title: e-Invoicing Custom API
  version: '1.4'
  description: 'Release Notes 21 September 2019'
servers:
  - url: http://{yourServer}:4720
    variables:
      yourServer:
        default: localhost
        description: Hostname or IP address of the ITAS server
  - url: https://{yourServer}:5720
    variables:
      yourServer:
        default: localhost
        description: Hostname or IP address of the ITAS server
security:
- bearerAuth: []
tags:
- name: Invoices
- name: Data Object Definitions
paths:
  /Invoices/{TradingEntityId}/IncomingInvoice/{Property}/{PropertyValue}:
    get:
      tags:
      - Invoices
      summary: List Incoming Invoice Records
      operationId: listIncomingInvoiceRecords
      parameters:
      - &id001
        name: TradingEntityId
        in: path
        required: true
        schema:
          type: string
        example: JT
        description: Identify specific trading entity.
      - name: Property
        in: path
        required: true
        schema:
          type: string
          enum:
          - AccountCode
          - ClientReference
          - DocumentDate
          - InvoiceRecordId
          - IsProcessed
      - name: PropertyValue
        in: path
        required: true
        schema:
          type: string
        example: ABCDEF.P
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  Data:
                    type: array
                    items:
                      $ref: '#/components/schemas/InvoiceReadBody'
                  Pagination:
                    $ref: '#/components/schemas/Pagination'
                  Response:
                    $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad property
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadPropertyResponse'
        '404': &id002
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '405': &id003
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error405'
  /Invoices/{TradingEntityId}/IncomingInvoice:
    post:
      tags:
      - Invoices
      summary: Create Incoming Invoice Record
      operationId: createIncomingInvoiceRecord
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreateBody'
            example:
              AccountCode: ABCDEFG.P
              ClientReference: '5879101647'
              CurrencyCode: EUR
              DocumentDate: '2025-07-14T00:00:00Z'
              ValueDate: '2025-08-14T00:00:00Z'
              Name: Coolblue N.V.
              VatRegistrationNo: NL823619357Z08
              EInvoiceId: 0478493179
              TotalInvoiceAmount: 729.17
              TotalInvoiceLinesExVatAmount: 745.91
              TotalVatAmount: 16.74
              InvoicePayableAmount: 719.27
              IBAN: UKBMGB22
              BIC: HBUKGB4B
              OrderNumber: Order 1
              TaxScheme: VAT
              SchemeId: '9944'
              DocumentType: '123'
              Notes: Received ready for processing
              InvoiceType: Contract
              BuyerOrderNo: BuyOrder1
              BuyerSwiftAddress: SWFTBUY123
              BuyerVatRegistrationNo: VATBUY4546
              ClientAddress1: 1 Downer Road
              ClientAddress3: Southend
              ClientAddress4: Essex
              ClientCountryCode: GB
              ClientFiscalRegistrationNo: CLIFIS789
              ClientPaymentTerms: 10 Days
              ClientTitle: I AM CLIENT
              ClientVatRegistrationNo: CLIVAT753
              ClientZipCode: SS2 3FF
              DeliveryClientAddress1: 16 Del Road
              DeliveryClientAddress3: Highgate
              DeliveryClientAddress4: London
              DeliveryClientCountryCode: GB
              DeliveryClientTitle: I AM DEL CLIENT
              DeliveryClientZipCode: N16 1JJ
              DeliveryDate: '2025-07-30T00:00:00Z'
              PaymentMethod: PAYMENT
              PaymentModeDescription: TRANSFER
              SupplierAddress3: 22 Supplier Ave
              SupplierAddress4: Dudley
              SupplierCountryCode: GB
              SupplierFiscalRegistrationNo: SUPPFIS951
              SupplierSwiftAddress: SUPSWFT357
              SupplierTitle: I AM SUPPLIER
              SupplierZipCode: MI7 9UU
              Source: eInvoice
              IncomingOrOutgoing: Incoming
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  Data:
                    $ref: '#/components/schemas/InvoiceIdResponse'
                  Response:
                    $ref: '#/components/schemas/CreateResponse'
        '400': &id004
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '404': *id002
        '405': *id003
  /Invoices/{TradingEntityId}/IncomingInvoice/{InvoiceRecordId}:
    put:
      tags:
      - Invoices
      summary: Update Incoming Invoice Record
      operationId: updateIncomingInvoiceRecord
      parameters:
      - *id001
      - &id005
        name: InvoiceRecordId
        in: path
        required: true
        schema:
          type: number
        example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceUpdateBody'
            example:
              InvoiceRecordId: 1
              AccountCode: ABCDEFG.P
              ClientReference: '5879101647'
              CurrencyCode: EUR
              DocumentDate: '2025-07-14T00:00:00Z'
              ValueDate: '2025-08-14T00:00:00Z'
              Name: Coolblue N.V.
              VatRegistrationNo: NL823619357Z08
              EInvoiceId: 0478493179
              TotalInvoiceAmount: 729.17
              TotalInvoiceLinesExVatAmount: 745.91
              TotalVatAmount: 16.74
              InvoicePayableAmount: 719.27
              IBAN: UKBMGB22
              BIC: HBUKGB4B
              OrderNumber: Order 1
              TaxScheme: VAT
              SchemeId: '9944'
              DocumentType: '123'
              Notes: Process with the following note
              InvoiceType: Contract
              BuyerOrderNo: BuyOrder1
              BuyerSwiftAddress: SWFTBUY123
              BuyerVatRegistrationNo: VATBUY4546
              ClientAddress1: 1 Downer Road
              ClientAddress3: Southend
              ClientAddress4: Essex
              ClientCountryCode: GB
              ClientFiscalRegistrationNo: CLIFIS789
              ClientPaymentTerms: 10 Days
              ClientTitle: I AM CLIENT
              ClientVatRegistrationNo: CLIVAT753
              ClientZipCode: SS2 3FF
              DeliveryClientAddress1: 16 Del Road
              DeliveryClientAddress3: Highgate
              DeliveryClientAddress4: London
              DeliveryClientCountryCode: GB
              DeliveryClientTitle: I AM DEL CLIENT
              DeliveryClientZipCode: N16 1JJ
              DeliveryDate: '2025-07-30T00:00:00Z'
              PaymentMethod: PAYMENT
              PaymentModeDescription: TRANSFER
              SupplierAddress3: 22 Supplier Ave
              SupplierAddress4: Dudley
              SupplierCountryCode: GB
              SupplierFiscalRegistrationNo: SUPPFIS951
              SupplierSwiftAddress: SUPSWFT357
              SupplierTitle: I AM SUPPLIER
              SupplierZipCode: MI7 9UU
              Source: eInvoice
              IncomingOrOutgoing: Incoming
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  Data:
                    $ref: '#/components/schemas/InvoiceIdResponse'
                  Response:
                    $ref: '#/components/schemas/UpdateResponse'
        '400': *id004
        '404': *id002
        '405': *id003
    delete:
      tags:
      - Invoices
      summary: Delete Incoming Invoice
      operationId: deleteIncomingInvoice
      parameters:
      - *id001
      - *id005
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  Data:
                    $ref: '#/components/schemas/InvoiceIdResponse'
                  Response:
                    $ref: '#/components/schemas/DeletedResponse'
        '400': *id004
        '404': *id002
        '405': *id003
  /InvoiceLeg:
    get:
      tags:
      - Data Object Definitions
      summary: Invoice Record Leg reference
      description: Reference-only object endpoint; source states these endpoints are not accessible.
      responses:
        '200':
          description: Reference object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLegReadUpdate'
  /InvoiceVatRecord:
    get:
      tags:
      - Data Object Definitions
      summary: Invoice VAT Record reference
      description: Reference-only object endpoint; source states these endpoints are not accessible.
      responses:
        '200':
          description: Reference object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceVatReadUpdate'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    InvoiceLegCreate:
      type: object
      properties:
        Quantity: &id006
          type: number
        WeightCode: &id007
          type: string
          maxLength: 4
        Value: &id008
          type: number
        Price: &id009
          type: number
        VatRatePercentage: &id010
          type: number
        InvoiceRecordLegDescription: &id011
          type: string
          maxLength: 255
        VatRateCode: &id012
          type: string
          maxLength: 2
        RateTypeCode: &id013
          type: string
          maxLength: 1
          enum:
          - A
          - R
          - S
          - W
          - '%'
          - Q
          - C
          - L
          - ' '
        PriceTypeCode: &id014
          type: string
          maxLength: 4
        PaymentModeCode: &id015
          type: string
          maxLength: 1
        PaymentId: &id016
          type: string
          maxLength: 255
        BuyerOrderIdentifier: &id017
          type: string
          maxLength: 50
        StartPeriod: &id018
          type: string
          format: date-time
        EndPeriod: &id019
          type: string
          format: date-time
        FreeFormatNote: &id020
          type: string
          maxLength: 255
        BaseQuantity: &id021
          type: number
        ValueType: &id022
          type: string
          enum:
          - Contract
          - Cost
          - Commission
        CostHeadingCode: &id023
          type: string
          maxLength: 8
        DocumentReference: &id024
          type: string
          maxLength: 9
        InvoiceCurrencyCode: &id025
          type: string
          maxLength: 3
        PhysicalTradeId: &id026
          type: string
          maxLength: 10
        CostUniqueId: &id027
          type: number
        VatAmount: &id028
          type: number
      required:
      - Quantity
      - WeightCode
      - Value
      - Price
      - VatRatePercentage
    InvoiceLegReadUpdate:
      type: object
      properties:
        InvoiceRecordId:
          type: number
        InvoiceRecordLegId:
          type: number
        Quantity: *id006
        WeightCode: *id007
        Value: *id008
        Price: *id009
        VatRatePercentage: *id010
        InvoiceRecordLegDescription: *id011
        VatRateCode: *id012
        RateTypeCode: *id013
        PriceTypeCode: *id014
        PaymentModeCode: *id015
        PaymentId: *id016
        BuyerOrderIdentifier: *id017
        StartPeriod: *id018
        EndPeriod: *id019
        FreeFormatNote: *id020
        BaseQuantity: *id021
        ValueType: *id022
        CostHeadingCode: *id023
        DocumentReference: *id024
        InvoiceCurrencyCode: *id025
        PhysicalTradeId: *id026
        CostUniqueId: *id027
        VatAmount: *id028
      required:
      - InvoiceRecordId
      - Quantity
      - WeightCode
      - Value
      - Price
      - VatRatePercentage
    InvoiceVatCreate:
      type: object
      properties:
        ExternalVatCode: &id029
          type: string
        VatPercentage: &id030
          type: number
        VatableAmount: &id031
          type: number
        VatAmount: &id032
          type: number
        ItasVatCode: &id033
          type: string
          maxLength: 2
        ExemptionReasonCode: &id034
          type: string
          maxLength: 50
        ExemptionReasonDescription: &id035
          type: string
          maxLength: 500
        InvoiceAmount: &id036
          type: number
        VatCurrencyCode: &id037
          type: string
          maxLength: 3
      required:
      - ExternalVatCode
      - VatPercentage
      - VatableAmount
      - VatAmount
    InvoiceVatReadUpdate:
      type: object
      properties:
        InvoiceRecordId:
          type: number
        InvoiceVatRecordId:
          type: number
        ExternalVatCode: *id029
        VatPercentage: *id030
        VatableAmount: *id031
        VatAmount: *id032
        ItasVatCode: *id033
        ExemptionReasonCode: *id034
        ExemptionReasonDescription: *id035
        InvoiceAmount: *id036
        VatCurrencyCode: *id037
      required:
      - InvoiceRecordId
      - ExternalVatCode
      - VatPercentage
      - VatableAmount
      - VatAmount
    InvoiceCreateBody:
      type: object
      properties:
        AccountCode:
          type: string
          description: Account Code
          maxLength: 10
        ClientReference:
          type: string
          description: Client Reference
          maxLength: 255
        CurrencyCode:
          type: string
          description: Currency Code
          maxLength: 3
        DocumentDate:
          type: string
          description: Document Date
          format: date-time
        ValueDate:
          type: string
          description: Value Date
          format: date-time
        Name:
          type: string
          description: Name
          maxLength: 40
        VatRegistrationNo:
          type: string
          description: Vat Registration Number
          maxLength: 20
        EInvoiceId:
          type: string
          description: e Invoice Id
          maxLength: 50
        TotalInvoiceAmount:
          type: number
          description: Total Invoice Amount
        TotalInvoiceLinesExVatAmount:
          type: number
          description: Total Invoice Lines Excluding Vat Amount
        TotalVatAmount:
          type: number
          description: Total Vat Amount
        InvoicePayableAmount:
          type: number
          description: Invoice Payable Amount
        IBAN:
          type: string
          description: IBAN
          maxLength: 255
        BIC:
          type: string
          description: BIC
          maxLength: 255
        OrderNumber:
          type: string
          description: Order Number
          maxLength: 255
        TaxScheme:
          type: string
