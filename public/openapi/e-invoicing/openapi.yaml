          maxLength: 4000
        InvoiceType:
          type: string
          description: InvoiceType
          maxLength: 60
        BuyerOrderNo:
          type: string
          description: Buyer Order Number
          maxLength: 50
        BuyerSwiftAddress:
          type: string
          description: Buyer SwiftAddress
          maxLength: 60
        BuyerVatRegistrationNo:
          type: string
